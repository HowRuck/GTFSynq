global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: gtfsynq-apps
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-app:8080
          - ingest-app:8081
          - store-app:8082

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308

  - job_name: victoriametrics
    static_configs:
      - targets:
          - victoriametrics:8428
