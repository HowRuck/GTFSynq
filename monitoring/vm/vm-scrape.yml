global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # The GTFSynq apps push OTLP metrics through the otel-collector (they no longer
  # expose a Prometheus /q/metrics endpoint), so they are not scraped here.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]

  - job_name: podman
    metrics_path: /metrics
    static_configs:
      - targets: ["prometheus-podman-exporter:9882"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
