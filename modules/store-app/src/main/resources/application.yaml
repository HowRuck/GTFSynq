quarkus:
  application:
    name: GTFSynq-Store
    version: 0.0.1-SNAPSHOT
  http:
    port: 8082

  # External infrastructure (TimescaleDB, Kafka) is provided by Compose or the
  # host; never start throwaway Dev Services containers for it.
  devservices:
    enabled: false

  # ---- Datasource ----------------------------------------------------------
  datasource:
    db-kind: postgresql
    username: postgres
    jdbc:
      url: jdbc:postgresql://localhost:5432/gtfsynq?reWriteBatchedInserts=true
      max-size: 10
    # Connection pool metrics (agroal_*) for the Grafana dashboards.
    metrics:
      enabled: true

  # ---- Object storage ------------------------------------------------------
  # Path-style access is required by local S3-compatible services (see ingest-app).
  s3:
    path-style-access: true

  # ---- Migrations ----------------------------------------------------------
  flyway:
    locations: classpath:db/migration
    migrate-at-start: true
    validate-on-migrate: true
    baseline-on-migrate: true

  # ---- Observability (/q/health) -------------------------------------------
  # Details are always included in the health JSON.
  # Metrics, logs and traces are exported via OpenTelemetry (OTLP); this app no
  # longer exposes a Prometheus /q/metrics endpoint (see build.gradle).
  micrometer:
    binder:
      http-server:
        suppress-non-application-uris: false

  # ---- OpenTelemetry -------------------------------------------------------
  # Traces are on by default; logs are enabled here (tech preview); metrics are
  # produced by Micrometer and bridged to OTLP by quarkus-micrometer-opentelemetry.
  # Every signal is exported as OTLP to the collector, which fans out to
  # VictoriaMetrics / VictoriaLogs / VictoriaTraces. service.name defaults to
  # quarkus.application.name.
  otel:
    # Set QUARKUS_OTEL_SDK_DISABLED=true when the app runs without the
    # monitoring stack, so it stops trying to reach an absent collector.
    sdk:
      disabled: ${QUARKUS_OTEL_SDK_DISABLED:false}
    logs:
      enabled: true
    exporter:
      otlp:
        # The collector defined in docker-compose.monitoring.yaml.
        endpoint: ${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
        protocol: grpc

  # Resolve the collector asynchronously. The default resolver does a blocking
  # InetAddress lookup on the Vert.x event loop when the host is unreachable,
  # which trips the blocked-thread checker.
  vertx:
    use-async-dns: true

  log:
    console:
      # Inject the active trace context into stdout so container logs stay
      # correlatable with traces in Grafana.
      format: "%d{HH:mm:ss} %-5p traceId=%X{traceId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{1}] (%t) %s%e%n"

  # ---- Container image (Jib) ----------------------------------------------
  # ./gradlew :store-app:imageBuild -Dquarkus.container-image.push=true
  container-image:
    registry: ghcr.io
    group: howruck
    name: gtfsynq-store-app

  # ---- Native image --------------------------------------------------------
  # OffHeapLongTable uses Arena.ofShared(); GraalVM disables shared arenas by
  # default in native images. JDK 25 Mandrel removed the parallel GC, so the
  # default serial GC is used (valid --gc values are epsilon and serial).
  native:
    additional-build-args: "-H:+UnlockExperimentalVMOptions,-H:+SharedArenaSupport"

# ---- Kafka consumer ------------------------------------------------------
kafka:
  bootstrap:
    servers: localhost:9092

mp:
  messaging:
    incoming:
      gtfs-trip-updates:
        connector: smallrye-kafka
        topic: gtfs-trip-updates
        # Consume in batches: a single record waiting for its 10s flush would cap throughput at one
        # record per flush. The batch is acknowledged as soon as it has been parsed and buffered; the
        # sink writes it to the database in the background, so database latency never holds up the
        # poll loop (an unacknowledged record used to kill the channel via the throttled commit).
        batch: true
        max:
          poll:
            records: 10000
        group:
          id: gtfsynq-store
        auto:
          offset:
            reset: earliest
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value:
          deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
        # Records are acknowledged per batch, so this is only headroom for a poll larger than the
        # sink's buffer; keep it at or above gtfsynq.sink.max-buffer-size.
        max-inflight-messages: 20000
      # Static feed revisions are validated before they are written; the group is separate from the
      # realtime consumer so a rebalance in one path cannot stall the other.
      gtfs-static-feeds:
        connector: smallrye-kafka
        topic: gtfs-static-feeds
        group:
          id: gtfsynq-store-static
        auto:
          offset:
            reset: earliest
        key:
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value:
          deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
        # One static event is a whole feed: fetch, validate, and a multi-minute COPY of the archive's
        # stop times before the row is acknowledged. The watchdog is a stall detector, not a latency
        # budget, so it sits well above the worst-case load (tens of millions of rows) and still
        # fails a genuinely stuck record.
        throttled:
          unprocessed-record-max-age:
            ms: 1800000

gtfsynq:
  # ---- Static archive storage (read path) ----------------------------------
  # Same keys as ingest-app, so one set of deployment values serves both apps.
  storage:
    s3:
      enabled: true
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: gtfsynq-static

  # ---- Static persistence --------------------------------------------------
  # A validated revision replaces the feed's previous one in a single transaction; a redelivered
  # event for the revision already loaded is recognised by its digest and writes nothing.
  static:
    persistence:
      enabled: true
      # Rows handed from the archive reader to the database writer per batch.
      batch-size: 5000

  # ---- Buffered sink -------------------------------------------------------
  sink:
    enabled: true
    flush-interval: 10s
    # Reaching this many buffered updates triggers an early flush.
    max-buffer-size: 20000

  # ---- Hot data retention --------------------------------------------------
  retention:
    hours: 1h
    rate: 15m

# The collector hostname only resolves inside the Compose network, so local dev
# mode disables the SDK unless QUARKUS_OTEL_SDK_DISABLED is set explicitly.
"%dev":
  quarkus:
    otel:
      sdk:
        disabled: true

    # The Quarkus Gradle plugin puts its LGTM dev resource on the dev-mode classpath. This
    # project exports to its own monitoring stack, so the dev resource is not used; leaving it
    # on makes the Dev UI observability endpoint require grafana.endpoint and otel-collector.url,
    # which nothing provides when LGTM is skipped.
    observability:
      enabled: false

    # S3 is the versitygw service in the compose stack; left enabled, the Amazon Services dev
    # service starts its own floci container next to it.
    s3:
      devservices:
        enabled: false

    # Compose Dev Services is a Dev Services implementation, so dev mode switches the global
    # switch back on (production keeps it off above). The explicit datasource and Kafka
    # settings keep the extension dev services from starting containers of their own.
    devservices:
      enabled: true

    # Compose Dev Services brings the infrastructure up with dev mode, so a single
    # ./gradlew :store-app:quarkusDev needs no separate `docker compose up`. The path is
    # relative to this module, which is the Gradle project root dev mode runs in.
    #
    # All apps share one fixed project name: an app that starts while the stack is already up
    # discovers it instead of starting a second copy on the same host ports. stop-services is
    # off so the first app to exit does not tear the stack down under the others, and Ryuk is
    # off for the same reason (and because it needs the Docker socket under rootless Podman).
    compose:
      devservices:
        files: ../../docker-compose.dev.yaml
        project-name: gtfsynq
        stop-services: false
        ryuk-enabled: false
        startup-timeout: 180s
