quarkus.application.name=GTFSynq-Store
quarkus.application.version=0.0.1-SNAPSHOT
quarkus.http.port=8082

# External infrastructure (TimescaleDB, Kafka) is provided by Compose or the
# host; never start throwaway Dev Services containers for it.
quarkus.devservices.enabled=false

# ---- Datasource ----------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gtfsynq
quarkus.datasource.jdbc.max-size=10

# Connection pool metrics (agroal_*) for the Grafana dashboards.
quarkus.datasource.metrics.enabled=true

# ---- Migrations ----------------------------------------------------------
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.baseline-on-migrate=true

# ---- Kafka consumer ------------------------------------------------------
kafka.bootstrap.servers=localhost:9092

mp.messaging.incoming.gtfs-trip-updates.connector=smallrye-kafka
mp.messaging.incoming.gtfs-trip-updates.topic=gtfs-trip-updates
mp.messaging.incoming.gtfs-trip-updates.group.id=gtfsynq-store
mp.messaging.incoming.gtfs-trip-updates.auto.offset.reset=earliest
mp.messaging.incoming.gtfs-trip-updates.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.gtfs-trip-updates.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# ---- Buffered sink -------------------------------------------------------
gtfsynq.sink.enabled=true
gtfsynq.sink.flush-interval=10s
gtfsynq.sink.max-buffer-size=20000

# ---- Hot data retention --------------------------------------------------
gtfsynq.retention.hours=1h
gtfsynq.retention.rate=15m

# ---- Observability (/q/health, /q/metrics) -------------------------------
# Details are always included in the health JSON.
# Count /q/* requests in http_server_requests_* (as the previous actuator did).
quarkus.micrometer.binder.http-server.suppress-non-application-uris=false

# ---- Container image (Jib) ----------------------------------------------
# ./gradlew :store-app:imageBuild -Dquarkus.container-image.push=true
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=howruck
quarkus.container-image.name=gtfsynq-store-app

# ---- Native image --------------------------------------------------------
# OffHeapLongTable uses Arena.ofShared(); GraalVM disables shared arenas by
# default in native images. JDK 25 Mandrel removed the parallel GC, so the
# default serial GC is used (valid --gc values are epsilon and serial).
quarkus.native.additional-build-args=-H:+UnlockExperimentalVMOptions,-H:+SharedArenaSupport
