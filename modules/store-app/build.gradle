plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    id 'java'
}

dependencies {
    implementation project(':shared')

    implementation libs.spring.boot.starter
    implementation libs.spring.boot.starter.web
    implementation libs.spring.boot.starter.actuator
    implementation libs.bundles.kafka
    implementation libs.spring.boot.starter.flyway

    // Reads the static feed archives the ingest app published to object storage,
    // so the same S3 configuration keys work in both apps.
    implementation libs.bundles.s3

    // Canonical GTFS Schedule validator (github.com/mobilitydata/gtfs-validator).
    // core and model are declared explicitly because the main artifact's POM keeps them
    // in runtime scope, which is not enough to compile against them.
    implementation libs.gtfs.validator.main
    implementation libs.gtfs.validator.core
    implementation libs.gtfs.validator.model
    implementation libs.guava

    runtimeOnly libs.flyway.database.postgresql

    runtimeOnly libs.postgresql
    runtimeOnly libs.micrometer.registry.prometheus

    compileOnly libs.bundles.lombok
    annotationProcessor libs.bundles.lombok
    annotationProcessor libs.spring.boot.configuration.processor

    testImplementation libs.bundles.integration.test
}

// The GTFS validator finds its rules and table descriptors by scanning the classpath
// (ClassGraphDiscovery). That works on a JVM, so the rules are discovered at runtime and
// there is no generated class list to keep in step with the validator version.

bootJar {
    archiveFileName = 'app.jar'
}
