quarkus.application.name=GTFSynq-API
quarkus.application.version=0.0.1-SNAPSHOT
quarkus.http.port=8080

# External infrastructure (TimescaleDB, Kafka, S3) is provided by Compose; never
# start throwaway Dev Services containers for it.
quarkus.devservices.enabled=false

# ---- Datasource ----------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gtfsynq
quarkus.datasource.jdbc.max-size=10

# Connection pool metrics (agroal_*) for the Grafana dashboards.
quarkus.datasource.metrics.enabled=true

quarkus.hibernate-orm.schema-management.strategy=validate

# ---- Observability (/q/health, /q/metrics) -------------------------------
# Details are always included in the health JSON.
# Count /q/* requests in http_server_requests_* (as the previous actuator did).
quarkus.micrometer.binder.http-server.suppress-non-application-uris=false

# ---- Container image (Jib) ----------------------------------------------
# ./gradlew :api-app:imageBuild -Dquarkus.container-image.push=true
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=howruck
quarkus.container-image.name=gtfsynq-api-app
# Pin the JVM runtime: Quarkus infers it from the bytecode of the application,
# which api-app (an entrypoint-only module) does not have.
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-25-runtime:1.24
