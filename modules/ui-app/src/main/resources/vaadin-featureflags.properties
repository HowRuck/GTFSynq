# Vaadin experimental feature flags, read from the classpath at startup.
#
# layoutComponentImprovements rewires Flow's setWidthFull/setHeightFull/setSizeFull to also
# apply flex: 1, so full-size components take the remaining space instead of shrinking below
# their specified size (and nested layouts may shrink below their content). It is enabled here
# rather than as a system property so local runs, CI and production behave identically.
com.vaadin.experimental.layoutComponentImprovements=true
com.vaadin.experimental.ssePushTransport=true
