spring:
    threads:
        virtual:
            enabled: true
    application:
        name: GTFSynq-Ingest
    kafka:
        topic: gtfs-trip-updates
        static-feed-topic: gtfs-static-feeds
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        streams:
            properties:
                auto.create.topics: "true"

server:
    port: ${SERVER_PORT:8081}

gtfs:
    feed-timeout-seconds: 55
    static-feed-timeout-seconds: 600
    sources:
        gtfs-de:
            static-config:
                url: https://download.gtfs.de/germany/free/latest.zip
            realtime-config:
                urls:
                    - https://realtime.gtfs.de/realtime-free.pb
                poll-interval-seconds: 30

        entur:
            static-config:
                url: https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_norway-aggregated-gtfs-basic.zip
            realtime-config:
                urls:
                    - https://api.entur.io/realtime/v1/gtfs-rt/trip-updates
                poll-interval-seconds: 30

        helsinki-hsl:
            static-config:
                url: https://infopalvelut.storage.hsldev.com/gtfs/hsl.zip
            realtime-config:
                urls:
                    - https://realtime.hsl.fi/realtime/trip-updates/v2/hsl
                poll-interval-seconds: 30

        ovapi:
            static-config:
                url: https://gtfs.ovapi.nl/nl/gtfs-nl.zip
            realtime-config:
                urls:
                    - https://gtfs.ovapi.nl/nl/tripUpdates.pb
                poll-interval-seconds: 30

        sncf:
            static-config:
                url: https://eu.ftp.opendatasoft.com/sncf/plandata/Export_OpenData_SNCF_GTFS_NewTripId.zip
            realtime-config:
                urls:
                    - https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-trip-updates
                    - https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-service-alerts
                poll-interval-seconds: 30

# GTFSynq-specific configuration
gtfsynq:
    # Realtime polling configuration
    polling:
        interval-ms: 60000
        enabled: true

    # Static feed polling configuration. Static feeds change on the order of days,
    # so they are polled far less often than realtime feeds.
    static-polling:
        enabled: true
        interval-ms: 86400000

    # Object storage for downloaded static feed archives
    storage:
        s3:
            enabled: true
            # Local default; point this at the compose `s3` service or any S3 compatible endpoint.
            endpoint: ${GTFSYNQ_STORAGE_S3_ENDPOINT:http://localhost:9000}
            region: ${GTFSYNQ_STORAGE_S3_REGION:us-east-1}
            bucket: ${GTFSYNQ_STORAGE_S3_BUCKET:gtfsynq-static}
            # Blank credentials fall back to the AWS default credentials provider chain.
            access-key: ${GTFSYNQ_STORAGE_S3_ACCESS_KEY:}
            secret-key: ${GTFSYNQ_STORAGE_S3_SECRET_KEY:}
            path-style-access: true

    # Source configuration
    source:
        rest:
            enabled: true
            timeout-ms: 10000
            retry-attempts: 3
            user-agent: GTFSynq/1.0

        websocket:
            enabled: false
            reconnect-interval-ms: 5000

    # Pipeline configuration
    pipeline:
        enabled: true

        # Filter configuration
        filters:
            deduplication:
                enabled: true
            entity-type:
                enabled: false
                # Only process these entity types (empty = all)
                allowed-types: []

    # Processor configuration
    processors:
        trip-update:
            enabled: true
        vehicle-position:
            enabled: true
        alert:
            enabled: true

# HTTP client tuning for feed polling
rest:
    readTimeoutSeconds: 120
    connectTimeoutSeconds: 40

# Native parser tuning
gtfs.readBufferSize: 8

management:
    metrics:
        tags:
            application: ${spring.application.name}
    endpoints:
        web:
            exposure:
                include: health,info,prometheus,metrics
    endpoint:
        health:
            show-details: ALWAYS

state:
    save:
        path: data/state_dump.bin
