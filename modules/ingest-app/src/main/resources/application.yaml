quarkus:
  application:
    name: GTFSynq-Ingest
    version: 0.0.1-SNAPSHOT
  http:
    port: 8081

  # External infrastructure (Kafka, S3) is provided by Compose or the host; never
  # start throwaway Dev Services containers for it.
  devservices:
    enabled: false

  s3:
    path-style-access: true

  # ---- Observability (/q/health) -------------------------------------------
  # Details are always included in the health JSON.
  # Metrics, logs and traces are exported via OpenTelemetry (OTLP); this app no
  # longer exposes a Prometheus /q/metrics endpoint (see build.gradle).
  micrometer:
    binder:
      http-server:
        suppress-non-application-uris: false

  # ---- OpenTelemetry -------------------------------------------------------
  # Traces are on by default; logs are enabled here (tech preview); metrics are
  # produced by Micrometer and bridged to OTLP by quarkus-micrometer-opentelemetry.
  # Every signal is exported as OTLP to the collector, which fans out to
  # VictoriaMetrics / VictoriaLogs / VictoriaTraces. service.name defaults to
  # quarkus.application.name.
  otel:
    # Set QUARKUS_OTEL_SDK_DISABLED=true when the app runs without the
    # monitoring stack, so it stops trying to reach an absent collector.
    sdk:
      disabled: ${QUARKUS_OTEL_SDK_DISABLED:false}
    logs:
      enabled: true
    exporter:
      otlp:
        # The collector defined in docker-compose.monitoring.yaml.
        endpoint: ${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
        protocol: grpc

  # Resolve the collector asynchronously. The default resolver does a blocking
  # InetAddress lookup on the Vert.x event loop when the host is unreachable,
  # which trips the blocked-thread checker.
  vertx:
    use-async-dns: true

  log:
    console:
      # Inject the active trace context into stdout so container logs stay
      # correlatable with traces in Grafana.
      format: "%d{HH:mm:ss} %-5p traceId=%X{traceId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{1}] (%t) %s%e%n"

  # ---- Container image (Jib) ----------------------------------------------
  # ./gradlew :ingest-app:imageBuild -Dquarkus.container-image.push=true
  container-image:
    registry: ghcr.io
    group: howruck
    name: gtfsynq-ingest-app

  # ---- Native image --------------------------------------------------------
  # OffHeapLongTable uses Arena.ofShared(); GraalVM disables shared arenas by
  # default in native images. JDK 25 Mandrel removed the parallel GC, so the
  # default serial GC is used (valid --gc values are epsilon and serial).
  native:
    additional-build-args: "-H:+UnlockExperimentalVMOptions,-H:+SharedArenaSupport"

# ---- Kafka producer ------------------------------------------------------
kafka:
  bootstrap:
    servers: localhost:9092
  key:
    serializer: org.apache.kafka.common.serialization.StringSerializer
  value:
    serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  # Batching/timeout tuning carried over from the Spring producer factory.
  linger:
    ms: 20
  batch:
    size: 32768
  delivery:
    timeout:
      ms: 120000
  request:
    timeout:
      ms: 30000

gtfsynq:
  kafka:
    trip-updates-topic: gtfs-trip-updates
    static-feeds-topic: gtfs-static-feeds

  # ---- Polling -------------------------------------------------------------
  # Durations; the realtime and static feeds run on independent schedules.
  # Static polls are cheap when the origin supports conditional requests: an
  # unchanged archive answers 304 and is not transferred again.
  polling:
    interval: 60s
  static-polling:
    enabled: true
    interval: 5m

  # ---- Static archive storage (S3 compatible) -----------------------------
  storage:
    s3:
      enabled: true
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: gtfsynq-static
      # access-key / secret-key are unset: the AWS default credentials provider chain is
      # used, unless GTFSYNQ_STORAGE_S3_ACCESS_KEY / GTFSYNQ_STORAGE_S3_SECRET_KEY are set

  # ---- HTTP client (feed downloads) ---------------------------------------
  http:
    connect-timeout-seconds: 40
    read-timeout-seconds: 120

  # ---- Native parser tuning ------------------------------------------------
  read-buffer-size: 8

# ---- GTFS sources --------------------------------------------------------
gtfs:
  feed-timeout-seconds: 55
  static-feed-timeout-seconds: 600

  sources:
    gtfs-de:
      static-config:
        url: https://download.gtfs.de/germany/free/latest.zip
      realtime-config:
        urls: https://realtime.gtfs.de/realtime-free.pb
        poll-interval-seconds: 60

    entur:
      static-config:
        url: https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_norway-aggregated-gtfs-basic.zip
      realtime-config:
        urls: https://api.entur.io/realtime/v1/gtfs-rt/trip-updates
        poll-interval-seconds: 60

    helsinki-hsl:
      static-config:
        url: https://infopalvelut.storage.hsldev.com/gtfs/hsl.zip
      realtime-config:
        urls: https://realtime.hsl.fi/realtime/trip-updates/v2/hsl
        poll-interval-seconds: 60

    ovapi:
      static-config:
        url: https://gtfs.ovapi.nl/nl/gtfs-nl.zip
      realtime-config:
        urls: https://gtfs.ovapi.nl/nl/tripUpdates.pb
        poll-interval-seconds: 60

    sncf:
      static-config:
        url: https://eu.ftp.opendatasoft.com/sncf/plandata/Export_OpenData_SNCF_GTFS_NewTripId.zip
      realtime-config:
        urls: https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-trip-updates,https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-service-alerts
        poll-interval-seconds: 60

# ---- Tests ---------------------------------------------------------------
# Polling is exercised in production; the context test must not run feeds, and the
# Micrometer Kafka binder eagerly creates the producer, so it is disabled too.
"%test":
  quarkus:
    scheduler:
      enabled: false
    micrometer:
      binder:
        kafka:
          enabled: false
    http:
      test-port: 0
    # No collector runs during tests: drop the OTel SDK at runtime.
    otel:
      sdk:
        disabled: true

# The collector hostname only resolves inside the Compose network, so local dev
# mode disables the SDK unless QUARKUS_OTEL_SDK_DISABLED is set explicitly.
"%dev":
  quarkus:
    otel:
      sdk:
        disabled: true

    # The Quarkus Gradle plugin puts its LGTM dev resource on the dev-mode classpath. This
    # project exports to its own monitoring stack, so the dev resource is not used; leaving it
    # on makes the Dev UI observability endpoint require grafana.endpoint and otel-collector.url,
    # which nothing provides when LGTM is skipped.
    observability:
      enabled: false

    # S3 is the versitygw service in the compose stack; left enabled, the Amazon Services dev
    # service starts its own floci container next to it.
    s3:
      devservices:
        enabled: false

    # Compose Dev Services is a Dev Services implementation, so dev mode switches the global
    # switch back on (production keeps it off above). The explicit Kafka settings keep the
    # Kafka dev service from starting a container of its own.
    devservices:
      enabled: true

    # Compose Dev Services brings the infrastructure up with dev mode, so a single
    # ./gradlew :ingest-app:quarkusDev needs no separate `docker compose up`. The path is
    # relative to this module, which is the Gradle project root dev mode runs in.
    #
    # All apps share one fixed project name: an app that starts while the stack is already up
    # discovers it instead of starting a second copy on the same host ports. stop-services is
    # off so the first app to exit does not tear the stack down under the others, and Ryuk is
    # off for the same reason (and because it needs the Docker socket under rootless Podman).
    compose:
      devservices:
        files: ../../docker-compose.dev.yaml
        project-name: gtfsynq
        stop-services: false
        ryuk-enabled: false
        startup-timeout: 180s
