quarkus.application.name=GTFSynq-Ingest
quarkus.application.version=0.0.1-SNAPSHOT
quarkus.http.port=8081

# External infrastructure (Kafka, S3) is provided by Compose or the host; never
# start throwaway Dev Services containers for it.
quarkus.devservices.enabled=false

# ---- Kafka producer ------------------------------------------------------
kafka.bootstrap.servers=localhost:9092
kafka.key.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# Batching/timeout tuning carried over from the Spring producer factory.
kafka.linger.ms=20
kafka.batch.size=32768
kafka.delivery.timeout.ms=120000
kafka.request.timeout.ms=30000

gtfsynq.kafka.trip-updates-topic=gtfs-trip-updates
gtfsynq.kafka.static-feeds-topic=gtfs-static-feeds

# ---- GTFS sources --------------------------------------------------------
gtfs.feed-timeout-seconds=55
gtfs.static-feed-timeout-seconds=600

gtfs.sources.gtfs-de.static-config.url=https://download.gtfs.de/germany/free/latest.zip
gtfs.sources.gtfs-de.realtime-config.urls=https://realtime.gtfs.de/realtime-free.pb
gtfs.sources.gtfs-de.realtime-config.poll-interval-seconds=60

gtfs.sources.entur.static-config.url=https://storage.googleapis.com/marduk-production/outbound/gtfs/rb_norway-aggregated-gtfs-basic.zip
gtfs.sources.entur.realtime-config.urls=https://api.entur.io/realtime/v1/gtfs-rt/trip-updates
gtfs.sources.entur.realtime-config.poll-interval-seconds=60

gtfs.sources.helsinki-hsl.static-config.url=https://infopalvelut.storage.hsldev.com/gtfs/hsl.zip
gtfs.sources.helsinki-hsl.realtime-config.urls=https://realtime.hsl.fi/realtime/trip-updates/v2/hsl
gtfs.sources.helsinki-hsl.realtime-config.poll-interval-seconds=60

gtfs.sources.ovapi.static-config.url=https://gtfs.ovapi.nl/nl/gtfs-nl.zip
gtfs.sources.ovapi.realtime-config.urls=https://gtfs.ovapi.nl/nl/tripUpdates.pb
gtfs.sources.ovapi.realtime-config.poll-interval-seconds=60

gtfs.sources.sncf.static-config.url=https://eu.ftp.opendatasoft.com/sncf/plandata/Export_OpenData_SNCF_GTFS_NewTripId.zip
gtfs.sources.sncf.realtime-config.urls=https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-trip-updates,https://proxy.transport.data.gouv.fr/resource/sncf-gtfs-rt-service-alerts
gtfs.sources.sncf.realtime-config.poll-interval-seconds=60

# ---- Polling -------------------------------------------------------------
# Durations; the realtime and static feeds run on independent schedules.
gtfsynq.polling.interval=60s
gtfsynq.static-polling.enabled=true
gtfsynq.static-polling.interval=24h

# ---- Static archive storage (S3 compatible) -----------------------------
gtfsynq.storage.s3.enabled=true
gtfsynq.storage.s3.endpoint=http://localhost:9000
gtfsynq.storage.s3.region=us-east-1
gtfsynq.storage.s3.bucket=gtfsynq-static
# access-key / secret-key are unset: the AWS default credentials provider chain is
# used, unless GTFSYNQ_STORAGE_S3_ACCESS_KEY / GTFSYNQ_STORAGE_S3_SECRET_KEY are set.
gtfsynq.storage.s3.path-style-access=true

# ---- HTTP client (feed downloads) ---------------------------------------
gtfsynq.http.connect-timeout-seconds=40
gtfsynq.http.read-timeout-seconds=120

# ---- Native parser tuning ------------------------------------------------
gtfsynq.read-buffer-size=8

# ---- Observability (/q/health, /q/metrics) -------------------------------
# Details are always included in the health JSON.
# Count /q/* requests in http_server_requests_* (as the previous actuator did).
quarkus.micrometer.binder.http-server.suppress-non-application-uris=false

# ---- Container image (Jib) ----------------------------------------------
# ./gradlew :ingest-app:imageBuild -Dquarkus.container-image.push=true
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=howruck
quarkus.container-image.name=gtfsynq-ingest-app
# Pin the JVM runtime instead of relying on bytecode detection.
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-25-runtime:1.24

# ---- Native image --------------------------------------------------------
# OffHeapLongTable uses Arena.ofShared(); GraalVM disables shared arenas by
# default in native images.
quarkus.native.additional-build-args=-H:+UnlockExperimentalVMOptions,-H:+SharedArenaSupport,--gc=parallel

# ---- Tests ---------------------------------------------------------------
# Polling is exercised in production; the context test must not run feeds, and the
# Micrometer Kafka binder eagerly creates the producer, so it is disabled too.
%test.quarkus.scheduler.enabled=false
%test.quarkus.micrometer.binder.kafka.enabled=false
%test.quarkus.http.test-port=0
