syntax = "proto3";

package gtfsynq.poll;

option java_package = "org.example.gtfsynq.shared.protocol";
option java_multiple_files = true;
option java_outer_classname = "FeedPollProtocol";

// Outcome of one poll of a feed, static or realtime.
enum PollStatus {
  POLL_STATUS_UNSPECIFIED = 0;
  // A new body was downloaded and parsed.
  POLL_STATUS_OK = 1;
  // The origin answered 304 Not Modified.
  POLL_STATUS_NOT_MODIFIED = 2;
  // The origin answered 429 Too Many Requests.
  POLL_STATUS_RATE_LIMITED = 3;
  // The origin answered with another non-2xx status.
  POLL_STATUS_HTTP_ERROR = 4;
  // Transport, parsing or other failure before a usable response.
  POLL_STATUS_ERROR = 5;
}

// Which kind of feed was polled.
enum FeedKind {
  FEED_KIND_UNSPECIFIED = 0;
  FEED_KIND_STATIC = 1;
  FEED_KIND_REALTIME = 2;
}

// Event published by the ingest app after every poll of a feed. It carries the poll outcome and
// the HTTP cache validators the origin sent, so the feeds table can show the state of static and
// realtime feeds side by side. It never carries feed content.
message FeedPolled {
  // Feed source identifier, e.g. "gtfs-de".
  string feed_id = 1;

  // Upstream URL that was polled.
  string source_url = 2;

  // Time of the poll, in seconds since the epoch.
  int64 polled_at_epoch_seconds = 3;

  // Outcome of the poll.
  PollStatus status = 4;

  // Kind of feed that was polled.
  FeedKind kind = 8;

  // Hex encoded SHA-256 of the downloaded body; empty when no body was transferred.
  string sha256 = 9;

  // Size of the downloaded body in bytes; 0 when no body was transferred.
  uint64 size_bytes = 5;

  // Upstream ETag, verbatim; empty when the origin sent none or the poll failed.
  string source_etag = 6;

  // Upstream Last-Modified, verbatim; empty when the origin sent none or the poll failed.
  string source_last_modified = 7;
}
