include:
    - docker-compose.monitoring.yaml

services:
    api-app:
        image: ghcr.io/howruck/gtfsynq-api-app:0.0.1-SNAPSHOT
        container_name: gtfsynq-api-app
        depends_on:
            kafka:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            timescaledb:
                condition: service_healthy
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/gtfsynq
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.template)}
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            SERVER_PORT: 8080
        ports:
            # Host-only by default. Expose externally via a reverse proxy
            # (Pangolin/Newt, Caddy, nginx) or an SSH tunnel, never 0.0.0.0.
            - "127.0.0.1:8080:8080"
        volumes:
            - gtfsynq-api-data:/app/data
        # NOTE: no healthcheck — Paketo run-tiny images contain no shell,
        # wget or curl, so any CMD-SHELL probe can never succeed.
        # Health is observable from the host via /actuator/health.

    ingest-app:
        image: ghcr.io/howruck/gtfsynq-ingest-app:0.0.1-SNAPSHOT
        container_name: gtfsynq-ingest-app
        depends_on:
            kafka:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            timescaledb:
                condition: service_healthy
            s3:
                condition: service_healthy
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/gtfsynq
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.template)}
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            SERVER_PORT: 8081
            STATE_SAVE_PATH: /app/data/state_dump.bin
            GTFSYNQ_STORAGE_S3_ENDPOINT: http://s3:7070
            GTFSYNQ_STORAGE_S3_REGION: ${S3_REGION:-us-east-1}
            GTFSYNQ_STORAGE_S3_BUCKET: ${GTFSYNQ_STORAGE_S3_BUCKET:-gtfsynq-static}
            GTFSYNQ_STORAGE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set (see .env.template)}
            GTFSYNQ_STORAGE_S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set (see .env.template)}
        ports:
            - "127.0.0.1:8081:8081"
        volumes:
            - gtfsynq-ingest-data:/app/data

    store-app:
        image: ghcr.io/howruck/gtfsynq-store-app:0.0.1-SNAPSHOT
        container_name: gtfsynq-store-app
        depends_on:
            kafka:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            timescaledb:
                condition: service_healthy
            s3:
                condition: service_healthy
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/gtfsynq
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.template)}
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            SERVER_PORT: 8082
            STATE_SAVE_PATH: /app/data/state_dump.bin
            # Static feed validation reads back the archives the ingest app stored.
            GTFSYNQ_STORAGE_S3_ENDPOINT: http://s3:7070
            GTFSYNQ_STORAGE_S3_REGION: ${S3_REGION:-us-east-1}
            GTFSYNQ_STORAGE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set (see .env.template)}
            GTFSYNQ_STORAGE_S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set (see .env.template)}
        ports:
            - "127.0.0.1:8082:8082"
        volumes:
            - gtfsynq-store-data:/app/data

    kafka:
        image: docker.io/apache/kafka:4.3.1
        container_name: kafka
        hostname: kafka
        ports:
            - "127.0.0.1:9092:9092"
            - "127.0.0.1:9093:9093"
        environment:
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_NODE_ID: 1
            KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk" # Unique cluster ID

            # Listeners configuration
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

            # Log retention and cleanup
            KAFKA_LOG_RETENTION_MS: 300000
            KAFKA_LOG_CLEANER_ENABLE: "true"

            # Replication factors (for standalone mode)
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

            # Message and fetch sizes (10MB)
            KAFKA_MESSAGE_MAX_BYTES: 10485760
            KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760

        volumes:
            - kafka-data:/var/lib/kafka/data

        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    kafka-init:
        image: docker.io/apache/kafka:4.3.1
        container_name: kafka-init
        depends_on:
            kafka:
                condition: service_healthy
        entrypoint:
            - /bin/sh
            - -c
        command:
            - |
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic gtfs-trip-updates --partitions 1 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic gtfs-static-feeds --partitions 1 --replication-factor 1
        restart: "no"

    s3:
        image: docker.io/versity/versitygw:v1.8.0
        container_name: gtfsynq-s3
        # S3-compatible object store for downloaded GTFS static feed archives.
        # MinIO's Docker Hub images were withdrawn, so this uses the Versity S3
        # Gateway over a plain directory backend instead.
        ports:
            - "127.0.0.1:9000:7070"
        environment:
            ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set (see .env.template)}
            ROOT_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set (see .env.template)}
            VGW_REGION: ${S3_REGION:-us-east-1}
        command: ["--port", ":7070", "posix", "/data"]
        volumes:
            - s3-data:/data
        healthcheck:
            # The S3 API rejects anonymous requests with 403, so probe the port
            # instead of an HTTP endpoint.
            test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 10s

    timescaledb:
        image: docker.io/timescale/timescaledb:2.30.1-pg18
        container_name: timescaledb
        ports:
            # Never publish the database publicly: it was the intrusion vector.
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.template)}
            POSTGRES_DB: ${POSTGRES_DB:-gtfsynq}
        volumes:
            - timescaledb-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d gtfsynq -h localhost"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

volumes:
    kafka-data:
    timescaledb-data:
    s3-data:
    gtfsynq-api-data:
    gtfsynq-ingest-data:
    gtfsynq-store-data:

networks:
    default:
        driver: bridge
