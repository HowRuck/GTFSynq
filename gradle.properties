org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=true

# Defaults cap the daemon at -Xmx512m -XX:MaxMetaspaceSize=384m, which is tight
# for Spring Boot + protobuf codegen + spotless
# -Dfile.encoding must be restated: setting org.gradle.jvmargs replaces the
# default set, which includes it
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true

# Jib gives up on a registry request after 20 seconds
# (com.google.cloud.tools.jib.global.JibSystemProperties#getHttpTimeout). Pushing
# the ~500 MB application images to ghcr regularly exceeds that on slower links,
# and Jib treats the timeout as fatal. 0 disables it; the CI job's own
# timeout-minutes still bounds a genuinely stuck build.
systemProp.jib.httpTimeout=0

# The build's own logic is Isolated Projects compatible (see build-logic/).
# It cannot be enabled globally yet: the Quarkus Gradle plugin 4.0.0.Beta1
# still reads mutable state of the ':shared' project during app configuration
# (Project.getState/afterEvaluate, task-graph access).
# org.gradle.isolated-projects=true
