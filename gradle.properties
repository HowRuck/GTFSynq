org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configuration-cache=true

# Defaults cap the daemon at -Xmx512m -XX:MaxMetaspaceSize=384m, which is tight
# for Spring Boot + protobuf codegen + spotless
# -Dfile.encoding must be restated: setting org.gradle.jvmargs replaces the
# default set, which includes it
# The --add-exports flags open javac's internal packages to the formatter, which
# the Spotless step runs inside the Gradle JVM. Without them spotlessJava fails
# with "module jdk.compiler does not export ...".
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

org.gradle.parallel=true

# Jib gives up on a registry request after 20 seconds
# (com.google.cloud.tools.jib.global.JibSystemProperties#getHttpTimeout). Pushing
# the ~500 MB application images to ghcr regularly exceeds that on slower links,
# and Jib treats the timeout as fatal. 0 disables it; the CI job's own
# timeout-minutes still bounds a genuinely stuck build.
systemProp.jib.httpTimeout=0

# The build's own logic is Isolated Projects compatible (see build-logic/).
# It cannot be enabled globally yet: the Quarkus Gradle plugin 4.0.0.Beta3
# still reads Project.gradle on the root project while configuring each app
# (":api-app cannot access Project.gradle on ':'"), and Isolated Projects
# requires the configuration cache. Re-test when a newer Quarkus plugin ships.
# org.gradle.isolated-projects=true
