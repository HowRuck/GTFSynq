services:
  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.template)}@timescaledb:5432/${POSTGRES_DB:-gtfsynq}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    restart: unless-stopped

  kafka-exporter:
    image: docker.io/danielqsj/kafka-exporter:v1.10.0
    container_name: kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
    ports:
      - "127.0.0.1:9308:9308"
    # kafka-exporter Fatal-exits if the broker isn't reachable at startup;
    # restart so it recovers from ordering races.
    restart: unless-stopped

  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=1w
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - victoria-logs-data:/victoria-logs-data
    restart: unless-stopped

  # Loki-compatible read API in front of VictoriaLogs so Grafana's built-in
  # Loki datasource, Explore and Logs Drilldown work without running Loki.
  loki-vl-proxy:
    image: docker.io/reliablyobserve/loki-vl-proxy:1.80.1
    container_name: loki-vl-proxy
    depends_on:
      - victorialogs
    command:
      - -listen=:3100
      - -backend=http://victorialogs:9428
      - -label-style=underscores
      - -metadata-field-mode=translated
      - -emit-structured-metadata=true
      - -patterns-enabled=true
      - -stream-fields=service_name,source_type
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  vector:
    image: docker.io/timberio/vector:0.58.0-debian
    container_name: vector
    security_opt:
      - label=disable
    depends_on:
      - victorialogs
    volumes:
      # Rootless Podman socket by default; override PODMAN_SOCKET for Docker
      # (/var/run/docker.sock) or a different setup (see .env.template).
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock
      - ./monitoring/vector:/etc/vector:ro,Z
    ports:
      - "127.0.0.1:8686:8686"
    restart: unless-stopped

  # Per-container + Podman-specific metrics (pods, images, volumes, networks,
  # container cgroup stats). Talks to the host's Podman over the socket.
  # The host's rootless Podman socket is bind-mounted to /var/run/docker.sock
  # inside the container, mirroring how Vector is configured in this file.
  # Override the host path via a .env file (PODMAN_SOCKET) for rootful Podman
  # (/run/podman/podman.sock) or Docker (/var/run/docker.sock).
  prometheus-podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:v2.0.0
    container_name: prometheus-podman-exporter
    security_opt:
      - label=disable
    # The image runs as nobody (65534), which cannot open the rootless socket
    # (owned by the host user, mode 0660). Running as root in the container maps
    # to the host uid via the rootless user namespace, granting access to it.
    user: "0:0"
    command:
      - --collector.enable-all
      - --web.listen-address=:9882
    environment:
      # Tell the exporter the socket path inside the container. PODMAN_URI is
      # the upstream-recognized variable; uri-scheme must be unix://.
      - CONTAINER_HOST=unix:///var/run/docker.sock
    volumes:
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock
    ports:
      - "127.0.0.1:9882:9882"
    restart: unless-stopped

  # Host-level metrics (CPU, memory, disk, filesystem, network, load).
  # pid: host + / mounted read-only is the standard node-exporter pattern.
  # security_opt label=disable matches Vector (line 62) so the read-only
  # bind of / works on SELinux-enforcing hosts (CentOS / RHEL) without
  # needing recursive :Z relabels, which podman refuses for /.
  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1
    container_name: node-exporter
    pid: host
    security_opt:
      - label=disable
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.152.0
    container_name: victoriametrics
    depends_on:
      - ingest-app
      - store-app
      - postgres-exporter
      - kafka-exporter
      - prometheus-podman-exporter
      - node-exporter
    command:
      - --storageDataPath=/victoria-metrics-data
      - --httpListenAddr=:8428
      - --promscrape.config=/etc/vm/vm-scrape.yml
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
      - ./monitoring/vm:/etc/vm:ro,Z
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: docker.io/grafana/grafana:13.2.1
    container_name: grafana
    depends_on:
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      loki-vl-proxy:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set (see .env.template)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro,Z

volumes:
  victoria-metrics-data:
  victoria-logs-data:
  grafana-data:

networks:
  default:
    driver: bridge
