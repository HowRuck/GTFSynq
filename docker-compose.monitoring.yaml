services:
  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@timescaledb:5432/gtfsynq?sslmode=disable
    ports:
      - "9187:9187"
    restart: unless-stopped

  kafka-exporter:
    image: docker.io/danielqsj/kafka-exporter:v1.10.0
    container_name: kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    # kafka-exporter Fatal-exits if the broker isn't reachable at startup;
    # restart so it recovers from ordering races.
    restart: unless-stopped

  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=1w
    ports:
      - "9428:9428"
    volumes:
      - victoria-logs-data:/victoria-logs-data
    restart: unless-stopped

  # Loki-compatible read API in front of VictoriaLogs so Grafana's built-in
  # Loki datasource, Explore and Logs Drilldown work without running Loki.
  loki-vl-proxy:
    image: docker.io/reliablyobserve/loki-vl-proxy:1.64.0
    container_name: loki-vl-proxy
    depends_on:
      - victorialogs
    command:
      - -listen=:3100
      - -backend=http://victorialogs:9428
      - -label-style=underscores
      - -metadata-field-mode=translated
      - -emit-structured-metadata=true
      - -patterns-enabled=true
      - -stream-fields=service_name,source_type
    ports:
      - "3100:3100"
    restart: unless-stopped

  vector:
    image: docker.io/timberio/vector:0.58.0-debian
    container_name: vector
    privileged: true
    depends_on:
      - victorialogs
    volumes:
      # Rootless Podman socket by default; override DOCKER_SOCKET for Docker
      # (/var/run/docker.sock) or a different setup.
      - ${DOCKER_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:ro
      - ./monitoring/vector:/etc/vector:ro,Z
    ports:
      - "8686:8686"
    restart: unless-stopped

  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.151.0
    container_name: victoriametrics
    depends_on:
      - ingest-app
      - store-app
      - postgres-exporter
      - kafka-exporter
    command:
      - --storageDataPath=/victoria-metrics-data
      - --httpListenAddr=:8428
      - --promscrape.config=/etc/vm/vm-scrape.yml
    ports:
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
      - ./monitoring/vm:/etc/vm:ro,Z
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: docker.io/grafana/grafana:13.2.1
    container_name: grafana
    depends_on:
      victoriametrics:
        condition: service_started
      victorialogs:
        condition: service_started
      loki-vl-proxy:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro,Z

volumes:
  victoria-metrics-data:
  victoria-logs-data:
  grafana-data:

networks:
  default:
    driver: bridge
