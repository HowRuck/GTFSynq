version: "1.0"
linter: qodana-jvm-community

# Start from the recommended profile; the `include` list below enables further
# inspections on top of it.
profile:
  name: qodana.recommended

plugins:
  - id: Docker
  - id: org.jetbrains.plugins.yaml
  # Third-party Cloud (IaC) Security plugin; provides the docker-compose/Kubernetes
  # inspections listed below.
  - id: dev.protsenko.security-linter

include:
  # --- Docker Compose and Kubernetes (YAML) -----------------------------------
  - name: DockerCompose
  - name: NonRootContainer
  - name: InsecureCapabilities
  - name: HostNetworkPidIpc
  - name: PrivilegedContainers
  - name: HostPathVolumes
  - name: HostPorts
  - name: AppArmorOverride
  - name: SettingSELinux
  - name: InsecureProcMount
  - name: SeccompProfile
  - name: InsecureSysctls
  - name: DisallowedVolumeType

  # --- Dockerfile -------------------------------------------------------------
  - name: DockerfileCmdAndEntrypoint
  - name: DockerfileCopyAndAdd
  - name: DockerFileEnv
  - name: DockerfileExpose
  - name: DockerfileFrom
  - name: DockerfileHealthCheck
  - name: DockerfileMaintainer
  - name: DockerfileRun
  - name: DockerfileUser
  - name: DockerfileWorkdir

  # --- Text, language and encoding --------------------------------------------
  - name: SpellCheckingInspection
  - name: LanguageDetectionInspection
  # Characters that the file's encoding cannot represent and would lose or garble on save.
  - name: LossyEncoding
  # Non-ASCII characters in unusual places: look-alike letters in identifiers, or typographic
  # dashes and arrows in strings and comments.
  - name: NonAsciiCharacters

  # --- Code size and complexity -----------------------------------------------
  - name: CyclomaticComplexityInspection
  - name: JvmLinesOfCodeInspection

  # --- Gradle: repositories ---------------------------------------------------
  - name: AvoidRepositoriesInBuildGradle
  - name: AvoidDuplicateRepositories
  - name: MultipleRepositoryUrls
  - name: JCenterRepository
  - name: BintrayPublishingPlugin

  # --- Gradle: dependencies ---------------------------------------------------
  - name: AvoidDuplicateDependencies
  - name: AvoidDependencyNamedArgumentsNotation
  - name: DependencyNotationArgument
  - name: DeprecatedConfigurations
  - name: LatestMinorVersion
  - name: RedundantKotlinStdLibDependency

  # --- Gradle: plugins and tasks ----------------------------------------------
  - name: AvoidApplyPluginMethod
  - name: IncorrectPluginDslStructure
  - name: ConfigurationAvoidance
  - name: TaskMissingDescription
  - name: ForeignDelegate

  # --- Properties files and i18n bundles --------------------------------------
  # Keys: duplicates, unused and incomplete entries.
  - name: DuplicatePropertyInspection
  - name: UnusedProperty
  - name: IncompleteProperty
  # Bundles: translations that drifted apart or use unknown locales.
  - name: InconsistentResourceBundle
  - name: SuspiciousLocalesLanguages
  - name: UnusedMessageFormatParameter
  # Style: ordering, delimiters, whitespace and ellipsis.
  - name: AlphaUnsortedPropertiesFile
  - name: WrongPropertyKeyValueDelimiter
  - name: TrailingSpacesInProperty
  - name: UseEllipsisInPropertyInspection

# Build output and generated sources are not ours to fix.
exclude:
  - name: All
    paths:
      # Build output
      - "**/build/**"
      - "**/bin/**"
      - "**/out/**"
      - "**/target/**"
      # Generated code, including the protobuf sources unpacked from dependencies
      - "**/generated/**"
      - "**/extracted-protos/**"
      - "**/extracted-include-protos/**"
