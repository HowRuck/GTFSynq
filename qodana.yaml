version: "1.0"

profile:
  name: qodana.recommended

include:
  - name: SpellCheckingInspection
  - name: GrazieInspection

linter: qodana-jvm-community

exclude:
  - name: All
    paths:
      - "**/build/**"
      - "**/bin/**"
      - "**/out/**"
      - "**/target/**"
      - "**/generated/**"
      - "**/extracted-protos/**"
      - "**/extracted-include-protos/**"
plugins:
  - id: com.intellij.grazie.pro
