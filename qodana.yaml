version: "1.0"

profile:
  name: qodana.recommended
  inspections:
    - inspection: SpellCheckingInspection
      enabled: true

linter: qodana-jvm-community

exclude:
  - name: All
    paths:
      - "**/build/**"
      - "**/bin/**"
      - "**/out/**"
      - "**/target/**"
      - "**/generated/**"
      - "**/extracted-protos/**"
      - "**/extracted-include-protos/**"
