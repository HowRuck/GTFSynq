services:
    kafka:
        image: docker.io/apache/kafka:4.3.1
        container_name: kafka
        hostname: kafka
        ports:
            - "127.0.0.1:9092:9092"
        environment:
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_NODE_ID: 1
            KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_LOG_RETENTION_MS: 300000
            KAFKA_LOG_CLEANER_ENABLE: "true"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_MESSAGE_MAX_BYTES: 10485760
            KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
        volumes:
            - kafka-data:/var/lib/kafka/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    kafka-init:
        image: docker.io/apache/kafka:4.3.1
        container_name: kafka-init
        depends_on:
            kafka:
                condition: service_healthy
        entrypoint:
            - /bin/sh
            - -c
        command:
            - |
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic gtfs-trip-updates --partitions 1 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists --topic gtfs-static-feeds --partitions 1 --replication-factor 1
        restart: "no"

    s3:
        image: docker.io/versity/versitygw:v1.8.0
        container_name: gtfsynq-s3
        # S3-compatible object store for downloaded GTFS static feed archives.
        ports:
            - "127.0.0.1:9000:7070"
        environment:
            ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:-gtfsynq}
            ROOT_SECRET_KEY: ${S3_SECRET_KEY:-gtfsynq-dev-secret}
            VGW_REGION: ${S3_REGION:-us-east-1}
        command: ["--port", ":7070", "posix", "/data"]
        volumes:
            - s3-data:/data
        healthcheck:
            # The S3 API rejects anonymous requests with 403, so probe the port
            # instead of an HTTP endpoint.
            test: ["CMD-SHELL", "nc -z 127.0.0.1 7070"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 10s

    timescaledb:
        image: docker.io/timescale/timescaledb:2.30.1-pg18
        container_name: timescaledb
        ports:
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.template)}
            POSTGRES_DB: ${POSTGRES_DB:-gtfsynq}
        volumes:
            - timescaledb-data:/var/lib/postgresql
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U postgres -d gtfsynq -h localhost"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

volumes:
    kafka-data:
    timescaledb-data:
    s3-data:

networks:
    default:
        driver: bridge
