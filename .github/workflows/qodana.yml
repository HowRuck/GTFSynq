name: qodana

on:
  push:
    branches: ["main"]
    paths:
      - "modules/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "qodana.yaml"
      - ".github/gradle/**"
      - ".github/workflows/qodana.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "modules/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "qodana.yaml"
      - ".github/gradle/**"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  security-events: write

jobs:
  qodana:
    runs-on: avrea-ubuntu-latest-4-vcpu
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set-up-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - name: set-up-gradle
        uses: gradle/actions/setup-gradle@v6
      - name: generate-proto-sources
        run: ./gradlew :shared:generateProto --init-script .github/gradle/maven-central-fallback.init.gradle
      - name: qodana-scan
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          # Same as the SARIF upload below: a fork PR gets a read-only
          # GITHUB_TOKEN, so commenting there would always fail
          post-pr-comment: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      - name: upload-sarif
        # Fork PRs get a read-only GITHUB_TOKEN, so the upload would always fail there
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
