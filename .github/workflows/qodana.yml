name: qodana

on:
  push:
    branches: ["main"]
    paths:
      - "modules/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "qodana.yaml"
      - ".github/workflows/qodana.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "modules/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "qodana.yaml"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  security-events: write

jobs:
  qodana:
    # Dependency-only PRs (Renovate) leave the sources untouched, so a scan just
    # re-reports the findings main already has while occupying a 4-vCPU runner
    # and a Qodana licence slot. The push run on main still analyses the merged
    # tree against the new classpath.
    if: >-
      github.event_name != 'pull_request'
      || !contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: avrea-ubuntu-26.04-4-vcpu
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # A pull_request run checks out GitHub's synthetic merge commit by
          # default, so a PR scan would also see target-branch changes merged in
          # and report them as findings introduced here. Scan the PR head
          # instead; push and workflow_dispatch have no PR head, so use the ref.
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
      - name: set-up-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - name: set-up-gradle
        uses: gradle/actions/setup-gradle@v6
      - name: generate-proto-sources
        run: ./gradlew :shared:generateProto
      - name: qodana-scan
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          # Same as the SARIF upload below: a fork PR gets a read-only
          # GITHUB_TOKEN, so commenting there would always fail
          post-pr-comment: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      - name: upload-sarif
        # Fork PRs get a read-only GITHUB_TOKEN, so the upload would always fail there
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
