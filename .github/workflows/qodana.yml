name: Qodana

on:
  push:
    branches: ["main"]
    paths:
      - "modules/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "qodana.yaml"
      - ".github/workflows/qodana.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "modules/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "qodana.yaml"
      - ".github/workflows/qodana.yml"
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate proto sources
        run: ./gradlew :shared:generateProto --info
      - name: "Qodana Scan"
        uses: JetBrains/qodana-action@v2026.2.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
