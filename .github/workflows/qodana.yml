name: Qodana

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Generate proto sources
        run: ./gradlew :shared:generateProto --info
      - name: "Qodana Scan"
        uses: JetBrains/qodana-action@v2026.2.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
