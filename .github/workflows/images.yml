name: Images

on:
  push:
    branches: ["main"]
    paths:
      - "modules/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        app: [api-app, ingest-app, store-app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache buildpack layers
        uses: actions/cache@v6
        with:
          path: .cnb-cache/${{ matrix.app }}
          key: cnb-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('gradle/libs.versions.toml', 'build.gradle', 'gradle.properties', 'modules/${{ matrix.app }}/build.gradle') }}
          restore-keys: |
            cnb-${{ runner.os }}-${{ matrix.app }}-
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: ./gradlew :${{ matrix.app }}:bootBuildImage -PpublishImage
