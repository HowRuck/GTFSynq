name: images

on:
  push:
    branches: ["main"]
    paths:
      - "modules/**"
      - "build-logic/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: detect-changes
    runs-on: avrea-ubuntu-26.04-1-vcpu
    outputs:
      # dorny/paths-filter emits a JSON array of the filters that matched, which is
      # exactly the app matrix below. A manual dispatch has no previous commit to
      # compare against, so it selects every app.
      apps: ${{ steps.filter-changed-apps.outputs.changes || steps.select-all-apps.outputs.apps }}
    steps:
      - name: checkout
        # paths-filter compares against the commit before the push, so the parent
        # commits must be present; a depth-1 checkout only has the pushed commit.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: filter-changed-apps
        id: filter-changed-apps
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          # Every app filter also lists the shared module and the build logic,
          # because a change there invalidates all four images.
          filters: |
            api-app:
              - 'modules/api-app/**'
              - 'modules/shared/**'
              - 'build-logic/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
            ingest-app:
              - 'modules/ingest-app/**'
              - 'modules/shared/**'
              - 'build-logic/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
            store-app:
              - 'modules/store-app/**'
              - 'modules/shared/**'
              - 'build-logic/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
            ui-app:
              - 'modules/ui-app/**'
              - 'modules/shared/**'
              - 'build-logic/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'

      - name: select-all-apps
        id: select-all-apps
        if: github.event_name == 'workflow_dispatch'
        run: echo 'apps=["api-app","ingest-app","store-app","ui-app"]' >> "$GITHUB_OUTPUT"

  build-push:
    name: build-push
    needs: detect-changes
    # An empty matrix is an error, so skip the job when nothing matched.
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: avrea-ubuntu-26.04-4-vcpu
    # Jib's HTTP timeout is disabled in gradle.properties, so bound the whole job
    # instead: a JVM image build plus a containerised native build fits well
    # inside this, and a dead registry connection cannot hang a runner forever.
    timeout-minutes: 15
    strategy:
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set-up-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: set-up-gradle
        uses: gradle/actions/setup-gradle@v6

      - name: cache-vaadin-toolchain-and-pnpm-store
        # Vaadin downloads its own Node/pnpm toolchain and frontend packages.
        if: matrix.app == 'ui-app'
        uses: actions/cache@v6
        with:
          path: |
            ~/.vaadin
            ~/.cache/pnpm
          key: ${{ runner.os }}-vaadin-${{ hashFiles('modules/ui-app/package.json', 'modules/ui-app/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-vaadin-

      - name: cache-jib-layers
        uses: actions/cache@v6
        with:
          path: ~/.cache/google-cloud-tools-jib
          key: ${{ runner.os }}-jib-${{ matrix.app }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-jib-${{ matrix.app }}-
            ${{ runner.os }}-jib-

      - name: log-in-to-github-container-registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-and-push-jvm-image
        # Quarkus/Jib builds the image without a Docker daemon and reads the
        # registry credentials written by docker/login-action.
        run: ./gradlew :${{ matrix.app }}:imageBuild -Dquarkus.container-image.push=true

      - name: build-and-push-native-image
        # Native compilation happens in the GraalVM builder container (Docker is
        # available on the runner), then Jib packages the executable without a
        # daemon. quarkus.package.jar.enabled=false is mandatory: the Gradle
        # plugin cannot emit a JAR and a native binary in the same build.
        run: >
          ./gradlew :${{ matrix.app }}:imageBuild
          -Dquarkus.container-image.push=true
          -Dquarkus.container-image.name=gtfsynq-${{ matrix.app }}-native
          -Dquarkus.native.enabled=true
          -Dquarkus.native.container-build=true
          -Dquarkus.package.jar.enabled=false
