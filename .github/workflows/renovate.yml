name: renovate

# Self-hosted Renovate. It runs on the runner itself rather than in the official
# Renovate container so that the postUpgradeTasks in renovate.json5 can call
# ./gradlew with the JDK that setup-java installs here. The hosted Renovate app
# cannot do that: its allowedCommands only lets a repository run `git add`,
# `git reset` and `pwd`.
#
# Renovate authenticates as a GitHub App: RENOVATE_APP_CLIENT_ID (repository
# variable) and RENOVATE_APP_PRIVATE_KEY (repository secret) are exchanged for a
# one-hour installation token. Disable the hosted Renovate app for this
# repository, or both will run.
on:
  schedule:
    # Inside the 0-5 UTC window that renovate.json5 allows updates in.
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: avrea-ubuntu-latest-2-vcpu
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # Renovate clones the repository into its own work directory and
          # pushes with RENOVATE_TOKEN, not with the checkout credentials.
          persist-credentials: false

      - name: set-up-java
        # postUpgradeTasks run ./gradlew, so the JDK must be on the PATH.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: set-up-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: set-up-pnpm
        # Node no longer bundles Corepack, so pnpm is installed explicitly.
        # This only runs Renovate; the Vaadin Gradle plugin downloads the pnpm
        # it uses for ui-app itself.
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: cache-gradle-and-vaadin
        # The postUpgradeTasks pay for a Gradle configuration plus, for ui-app,
        # the Vaadin toolchain and pnpm store. ~/.cache/pnpm also holds the
        # `dlx` install of Renovate itself; its content-addressable store lives
        # under ~/setup-pnpm, the action's own install directory, so that one is
        # deliberately not cached.
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.vaadin
            ~/.cache/pnpm
          key: renovate-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'modules/ui-app/package.json', 'modules/ui-app/pnpm-workspace.yaml') }}
          restore-keys: |
            renovate-${{ runner.os }}-

      - name: create-app-token
        id: app-token
        # A one-hour installation token, revoked in this action's post step.
        # It inherits the installation's permissions, which must include
        # Contents, Pull requests, Issues and Workflows write access.
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: resolve-bot-identity
        # The committer email needs the bot user's numeric id, which is not the
        # app id: /users/<slug>[bot].
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug="${{ steps.app-token.outputs.app-slug }}"
          bot_id=$(gh api "/users/${slug}[bot]" --jq .id)
          echo "git-author=${slug}[bot] <${bot_id}+${slug}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: run-renovate
        # pnpm blocks lifecycle scripts by default. re2 fetches a prebuilt
        # binary for the runner's Node ABI (Renovate otherwise falls back to the
        # slower JS RegExp engine), and the other three are transitive build
        # scripts of Renovate's own dependencies; allowing them keeps the log
        # clean instead of printing "Ignored build scripts".
        run: >-
          pnpm dlx
          --allow-build re2
          --allow-build core-js-pure
          --allow-build protobufjs
          --allow-build dtrace-provider
          renovate@44
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Commits and pull requests are both authored by the app's bot user,
          # so attribution stays consistent across the whole update.
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.git-author }}
          # Global config: allowedCommands, allowedUnsafeExecutions, binarySource.
          RENOVATE_CONFIG_FILE: .github/renovate-global.json5
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: info
