version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "build"
      include: scope
    pull-request-branch-name:
      separator: "/"
  - package-ecosystem: docker-compose
    directories:
      - "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "build"
      include: scope
    pull-request-branch-name:
      separator: "/"
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "build"
      include: scope
    pull-request-branch-name:
      separator: "/"
