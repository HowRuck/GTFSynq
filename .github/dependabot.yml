version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - "/"
    schedule:
      interval: daily
    ignore:
      # The Avrea CI proxy mirrors a curated subset of Maven Central and
      # rewrites Central URLs to itself, so it can only serve artifacts it has
      # synced. Yavi patch releases arrive late and 0.17.2 broke the image
      # build; stop proposing them until the proxy catches up.
      - dependency-name: "am.ik.yavi:yavi"
        update-types:
          - "version-update:semver-patch"
    commit-message:
      prefix: "build"
      include: scope
    pull-request-branch-name:
      separator: "/"
  - package-ecosystem: docker-compose
    directories:
      - "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "build"
      include: scope
    pull-request-branch-name:
      separator: "/"
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "build"
      include: scope
    pull-request-branch-name:
      separator: "/"
