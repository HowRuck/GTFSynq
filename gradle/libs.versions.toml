[versions]
protobuf = "4.36.0"
protobufPlugin = "0.10.0"
javatuples = "2.0.1"
zero-allocation-hashing = "2026.0"
jspecify = "1.0.0"
grpc = "1.82.0"
spring-boot = "4.2.0-M1"
spring-dependency-management = "1.1.7"
sonarqube = "7.4.0.8496"
spotless = "8.10.1"
palantir-java-format = "2.97.0"
datafusion-java = "0.1.0"

[libraries]
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
javatuples = { module = "io.arxila.javatuples:javatuples", version.ref = "javatuples" }
zero-allocation-hashing = { module = "net.openhft:zero-allocation-hashing", version.ref = "zero-allocation-hashing" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
grpc-all = { module = "io.grpc:grpc-all", version.ref = "grpc" }
lombok = { module = "org.projectlombok:lombok" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
spring-context = { module = "org.springframework:spring-context" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
kafka-streams = { module = "org.apache.kafka:kafka-streams" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
datafusion-java = { module = "org.apache.arrow:datafusion-java" }

[bundles]
lombok = ["lombok"]
web = ["spring-boot-starter-web", "spring-boot-starter-actuator"]
kafka = ["spring-boot-starter-kafka", "kafka-streams"]
integration-test = ["spring-boot-starter-test", "spring-kafka-test"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
