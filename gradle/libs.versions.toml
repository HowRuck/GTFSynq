[versions]
protobufPlugin = "0.10.0"
sonarqube = "7.5.0.8588"
spotless = "8.10.3"
palantir-java-format = "2.100.0"

# Frameworks & runtimes
quarkus = "3.40.1"
protobuf = "4.36.2"

# Jakarta EE APIs used by the framework-agnostic :shared module
jakarta-inject = "2.0.1"
jakarta-enterprise-cdi = "5.0.0"
microprofile-config = "3.1.2"

# Misc libraries
lombok = "1.18.48"
slf4j = "2.0.20"
javatuples = "2.0.1"
zero-allocation-hashing = "2026.0"
jspecify = "1.0.1"
micrometer-jvm-extras = "0.3.0"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# Jakarta EE APIs (provided by Quarkus at runtime)
jakarta-inject-api = { module = "jakarta.inject:jakarta.inject-api", version.ref = "jakarta-inject" }
jakarta-enterprise-cdi-api = { module = "jakarta.enterprise:jakarta.enterprise.cdi-api", version.ref = "jakarta-enterprise-cdi" }
microprofile-config-api = { module = "org.eclipse.microprofile.config:microprofile-config-api", version.ref = "microprofile-config" }

# Quarkus platform and extensions

# Platform / BOM
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-amazon-services-bom = { module = "io.quarkus.platform:quarkus-amazon-services-bom", version.ref = "quarkus" }
# Core & Runtime
quarkus-arc = { module = "io.quarkus:quarkus-arc" }
quarkus-vertx-http = { module = "io.quarkus:quarkus-vertx-http" }
quarkus-scheduler = { module = "io.quarkus:quarkus-scheduler" }
# Configuration (application.yaml instead of application.properties)
quarkus-config-yaml = { module = "io.quarkus:quarkus-config-yaml" }
# Web API & Validation
quarkus-rest = { module = "io.quarkus:quarkus-rest" }
quarkus-hibernate-validator = { module = "io.quarkus:quarkus-hibernate-validator" }
# Persistence & Relational Databases
quarkus-hibernate-orm = { module = "io.quarkus:quarkus-hibernate-orm" }
quarkus-jdbc-postgresql = { module = "io.quarkus:quarkus-jdbc-postgresql" }
quarkus-flyway = { module = "io.quarkus:quarkus-flyway" }
# Messaging & Event-Driven Architecture
quarkus-kafka-client = { module = "io.quarkus:quarkus-kafka-client" }
quarkus-messaging-kafka = { module = "io.quarkus:quarkus-messaging-kafka" }
# Observability & Operations
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-micrometer-registry-prometheus = { module = "io.quarkus:quarkus-micrometer-registry-prometheus" }
# Build, Containerization & Testing
quarkus-container-image-jib = { module = "io.quarkus:quarkus-container-image-jib" }
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5" }

# Managed S3 client plus the GraalVM substitutions that make the AWS SDK v2
# native-image friendly (strips the optional aws-crt checksum references when
# aws-crt is absent).
quarkus-amazon-s3 = { module = "io.quarkiverse.amazonservices:quarkus-amazon-s3" }

# Persistence
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Messaging
kafka-clients = { module = "org.apache.kafka:kafka-clients" }

# Observability
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-jvm-extras = { module = "io.github.mweirauch:micrometer-jvm-extras", version.ref = "micrometer-jvm-extras" }

# HTTP client backing the Amazon S3 sync client (version from the Amazon
# Services BOM). The S3 extension marks all HTTP clients optional.
aws-sdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }

# Data formats & serialization
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

# Misc libraries
javatuples = { module = "io.arxila.javatuples:javatuples", version.ref = "javatuples" }
zero-allocation-hashing = { module = "net.openhft:zero-allocation-hashing", version.ref = "zero-allocation-hashing" }

[bundles]
lombok = ["lombok"]

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
