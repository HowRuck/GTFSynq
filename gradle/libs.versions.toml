[versions]
protobufPlugin = "0.10.0"
sonarqube = "7.5.0.8588"
spotless = "8.10.3"
palantir-java-format = "2.101.0"

# Frameworks & core dependencies
spring-boot = "4.2.0-M2"
spring-dependency-management = "1.1.7"
grpc = "1.84.0"
protobuf = "4.36.2"
datafusion-java = "0.1.0"

# Misc libraries
javatuples = "2.0.1"
zero-allocation-hashing = "2026.0"
aws-sdk = "2.55.7"
gtfs-validator = "8.0.1"
guava = "33.5.0-jre"
jspecify = "1.0.1"
micrometer-jvm-extras = "0.3.0"

[libraries]
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
lombok = { module = "org.projectlombok:lombok" }

# Spring Boot starters
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }

# Spring testing
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# Persistence
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Messaging & streaming
kafka-streams = { module = "org.apache.kafka:kafka-streams" }

# Observability
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-jvm-extras = { module = "io.github.mweirauch:micrometer-jvm-extras", version.ref = "micrometer-jvm-extras" }

# HTTP client
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }

# Object storage (S3 compatible)
aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
aws-sdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client", version.ref = "aws-sdk" }

# GTFS Schedule validation
# gtfs-validator-main declares core and model as `implementation`, so its published POM
# exposes them in runtime scope only. They are needed at compile time, hence listed here.
gtfs-validator-main = { module = "org.mobilitydata.gtfs-validator:gtfs-validator-main", version.ref = "gtfs-validator" }
gtfs-validator-core = { module = "org.mobilitydata.gtfs-validator:gtfs-validator-core", version.ref = "gtfs-validator" }
gtfs-validator-model = { module = "org.mobilitydata.gtfs-validator:gtfs-validator-model", version.ref = "gtfs-validator" }

guava = { module = "com.google.guava:guava", version.ref = "guava" }

# Data formats & serialization
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
grpc-all = { module = "io.grpc:grpc-all", version.ref = "grpc" }
datafusion-java = { module = "org.apache.datafusion:datafusion-java", version.ref = "datafusion-java" }

# Misc libraries
javatuples = { module = "io.arxila.javatuples:javatuples", version.ref = "javatuples" }
zero-allocation-hashing = { module = "net.openhft:zero-allocation-hashing", version.ref = "zero-allocation-hashing" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
spring-context = { module = "org.springframework:spring-context" }

[bundles]
lombok = ["lombok"]
web = ["spring-boot-starter-web", "spring-boot-starter-actuator"]
kafka = ["spring-boot-starter-kafka", "kafka-streams"]
s3 = ["aws-sdk-s3", "aws-sdk-url-connection-client"]
integration-test = ["spring-boot-starter-test", "spring-kafka-test"]

[plugins]
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Frameworks
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
