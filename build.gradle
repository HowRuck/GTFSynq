plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    alias(libs.plugins.protobuf) apply false
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.spotless) apply false
}

allprojects {
    group = 'org.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: "org.springframework.boot.aot"
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            palantirJavaFormat(libs.versions.palantir.java.format.get())
            removeUnusedImports()
            importOrder()
            formatAnnotations()
        }
    }

    dependencyManagement {
        dependencies {
            dependency "com.google.protobuf:protobuf-java:${libs.versions.protobuf.get()}"
            dependency "com.google.protobuf:protobuf-kotlin:${libs.versions.protobuf.get()}"
            dependency "com.google.protobuf:protobuf-java-util:${libs.versions.protobuf.get()}"
        }
    }

    java {
        targetCompatibility = JavaVersion.VERSION_25
        sourceCompatibility = JavaVersion.VERSION_25
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    plugins.withId('org.springframework.boot') {
        tasks.named('bootBuildImage') {
            imageName = "gtfsynq-${project.name}:${project.version}"
            // JVM version is derived automatically from the java toolchain above (25).
            environment = [
                    "BPL_JVM_THREAD_COUNT": "50",
                    "JAVA_TOOL_OPTIONS"   : "--add-opens=java.base/java.nio=ALL-UNNAMED -XX:+ExitOnOutOfMemoryError"
            ]
        }
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "HowRuck_NordSIRI"
        property "sonar.organization", "nordsiri"
        property "sonar.coverage.exclusions", "**"
    }
}
