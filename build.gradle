plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    alias(libs.plugins.protobuf) apply false
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.spotless) apply false
}

allprojects {
    group = 'org.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            // protoc output is regenerated on every codegen, so formatting it is
            // wasted work and made spotlessJavaApply fail on files we don't own.
            targetExclude 'build/generated/**'
            palantirJavaFormat(libs.versions.palantir.java.format.get())
            removeUnusedImports()
            importOrder()
        }
    }

    dependencyManagement {
        dependencies {
            dependency "com.google.protobuf:protobuf-java:${libs.versions.protobuf.get()}"
            dependency "com.google.protobuf:protobuf-kotlin:${libs.versions.protobuf.get()}"
            dependency "com.google.protobuf:protobuf-java-util:${libs.versions.protobuf.get()}"
        }
    }

    java {
        targetCompatibility = JavaVersion.VERSION_27
        sourceCompatibility = JavaVersion.VERSION_27
        toolchain {
            languageVersion = JavaLanguageVersion.of(27)
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    plugins.withId('org.springframework.boot') {
        tasks.named('bootBuildImage') {
            // Build:  ./gradlew bootBuildImage
            // Push:   docker login ghcr.io -u <user> # once
            //         ./gradlew bootBuildImage -PpublishImage -PimageTag=latest
            def registry = findProperty('imageRegistry') ?: 'ghcr.io/howruck'
            def tag = findProperty('imageTag') ?: project.version
            imageName = "${registry}/gtfsynq-${project.name}:${tag}"
            publish = project.hasProperty('publishImage')

            buildpacks = [
                'docker://docker.io/paketobuildpacks/bellsoft-liberica:11.10.0',
                'urn:cnb:builder:paketo-buildpacks/java'
            ]

            environment.putAll([
                    "BPL_JVM_THREAD_COUNT": "50",
                    "BP_SPRING_CLOUD_BINDINGS_DISABLED": "true",
                    "JAVA_TOOL_OPTIONS": "--add-opens=java.base/java.nio=ALL-UNNAMED -XX:+ExitOnOutOfMemoryError"
            ])
            // Persist buildpack layers/tooling (JDK, GraalVM, ...) to a host
            // directory instead of a Docker named volume so CI can cache it
            // with actions/cache across ephemeral runners.
            def cnbCacheDir = rootProject.file(".cnb-cache/${project.name}")
            buildWorkspace {
                bind {
                    source = new File(cnbCacheDir, 'workspace').absolutePath
                }
            }
            buildCache {
                bind {
                    source = new File(cnbCacheDir, 'build').absolutePath
                }
            }
            launchCache {
                bind {
                    source = new File(cnbCacheDir, 'launch').absolutePath
                }
            }
        }
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "HowRuck_NordSIRI"
        property "sonar.organization", "nordsiri"
        property "sonar.coverage.exclusions", "**"
    }
}
