plugins {
    alias(libs.plugins.protobuf) apply false
    alias(libs.plugins.sonarqube)
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.quarkus) apply false
}

allprojects {
    group = 'org.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

    spotless {
        java {
            // protoc output is regenerated on every codegen, so formatting it is
            // wasted work and made spotlessJavaApply fail on files we don't own.
            targetExclude 'build/generated/**'
            palantirJavaFormat(libs.versions.palantir.java.format.get())
            removeUnusedImports()
            importOrder()
        }
    }

    java {
        targetCompatibility = JavaVersion.VERSION_25
        sourceCompatibility = JavaVersion.VERSION_25
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
            vendor = JvmVendorSpec.ADOPTIUM
        }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    // The generated protobuf code validates at runtime that protobuf-java is at
    // least as new as the protoc that produced it, so the runtime must not be
    // downgraded by a platform/BOM constraint.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.protobuf') {
                details.useVersion(libs.versions.protobuf.get())
            }
        }
    }
}

// Quarkus apps are packaged by the `io.quarkus` plugin (see modules/*/build.gradle)
// and containerised by the Jib extension, configured in each app's
// application.yaml:
//
//   ./gradlew :api-app:build                          # JVM fast-jar
//   ./gradlew :api-app:imageBuild                     # local container image
//   ./gradlew :api-app:imageBuild -Dquarkus.container-image.push=true
//   ./gradlew :api-app:build -Dnative                 # native executable
sonarqube {
    properties {
        property "sonar.projectKey", "HowRuck_NordSIRI"
        property "sonar.organization", "nordsiri"
        property "sonar.coverage.exclusions", "**"
    }
}
